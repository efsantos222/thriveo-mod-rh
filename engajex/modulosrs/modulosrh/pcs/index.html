<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cargos</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Gestão de Cargos e Salários</h1>
        <div class="list-group">
            <a href="administracao.html" class="list-group-item list-group-item-action">Administração</a>
            <a href="cadastro_cargos.html" class="list-group-item list-group-item-action">Cadastro de Cargos</a>
            <a href="cadastro_funcoes_gerenciais.html" class="list-group-item list-group-item-action">Cadastro de Funções Gerenciais</a>
            <a href="cadastro_vagas.html" class="list-group-item list-group-item-action">Cadastro e Controle de Vagas</a>
            <a href="benchmarking.html" class="list-group-item list-group-item-action">Benchmarking de Salários de Mercado</a>
            <a href="relatorios.html" class="list-group-item list-group-item-action">Relatórios de Cargos, Funções Gerenciais e Vagas</a>
        </div>
    </div>
    <div class="container">
        <h2 class="mt-5">Cadastro de Cargos</h2>
        <form action="cadastrar_cargo.php" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Cargo</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="nivel">Nível</label>
                <select class="form-control" id="nivel" name="nivel">
                    <option>Júnior</option>
                    <option>Pleno</option>
                    <option>Sênior</option>
                </select>
            </div>
            <div class="form-group">
                <label for="experiencia">Experiência Mínima (anos)</label>
                <input type="number" class="form-control" id="experiencia" name="experiencia" required>
            </div>
            <div class="form-group">
                <label for="formacao">Formação Acadêmica</label>
                <input type="text" class="form-control" id="formacao" name="formacao" required>
            </div>
            <div class="form-group">
                <label for="faixa_salarial">Faixa Salarial</label>
                <input type="number" class="form-control" id="faixa_salarial" name="faixa_salarial" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
    </div>
</body>
</html>
